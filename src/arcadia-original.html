const KK={es:{rt:"Reglas del camino de la NASA",rn:"Hay más reglas; mostramos estas como ejemplo para nuestro proyecto.",pro:"Ventajas",con:"Desventajas",
rules:["Los astronautas deben permanecer en la EZ (Zona de Exploración) para no perder el contacto por radio; la región máxima es de 100 km en la mayoría de las exploraciones.","No deben entrar en regiones especiales (cuevas y ambientes subterráneos a más de unos 5 m / 16 pies), aunque estén dentro de la EZ.","Evitar por completo los percloratos (sustancia muy peligrosa para los humanos) y cualquier suelo volcánico o zona con alta probabilidad volcánica.","Límite de pendiente: más de 30° no es transitable."],
s:{a:{b:"Una de las regiones volcánicas llanas más jóvenes de Marte, con enormes cantidades de hielo de agua puro enterrado a poca profundidad. Nuestra mejor candidata para una EZ segura.",p:["Terreno predominantemente plano: cumple con facilidad el límite de 30°.","Gran reserva de hielo subterráneo para ISRU: agua potable, soporte vital y combustible para el regreso."],c:["Campos de dunas e irregularidades tectónicas locales que complican el tránsito si no se planea bien.","Percloratos en el polvo superficial: exigen trajes y sistemas de sellado muy rigurosos."]},
m:{b:"Llanura extensa y suave justo al sur del ecuador, famosa por sus minerales de sulfato (como la hematita gris), señal de que estuvo empapada de agua. El rover Opportunity aterrizó allí en 2004, en el cráter Eagle. Es una de las áreas más cartografiadas de Marte.",p:["Una de las regiones más llanas y fáciles de recorrer: pendientes mínimas.","Superficie plana con excelente visibilidad; facilita la navegación de larga distancia."],c:["Campos de dunas de arena basáltica oscura (como el Ripple Terrain) que pueden atrapar vehículos pesados o dificultar el paso a pie.","Regolito rico en sulfatos y sales: exige protocolos estrictos contra la toxicidad (percloratos)."]},
g:{b:"Cráter de impacto de unos 160 km que fue un gran lago alimentado por el canal Ma'adim Vallis. Su suelo quedó cubierto por coladas de lava basáltica posteriores y tiene una cadena de colinas internas, las Columbia Hills. El rover Spirit aterrizó allí en 2004.",p:["Gran diversidad geológica en poco espacio: planicies de impacto fáciles de recorrer y colinas con pruebas de antiguas fuentes hidrotermales."],c:["Las planicies parecían fáciles, pero están alfombradas de rocas basálticas ocultas y polvo trampa.","En las colinas y bordes del cráter hay pendientes que pueden superar los 30° y suelo polvoriento muy suelto (sitio «Troy», donde un rover quedó atrapado).","Spirit quedó atrapado en suelo inestable en 2009 y perdió el contacto en 2010."]}}},
en:{rt:"NASA's rules of the road",rn:"There are more rules; we show these as an example for our project.",pro:"Advantages",con:"Disadvantages",
rules:["Astronauts must stay inside the EZ (Exploration Zone) to avoid losing radio contact; the maximum region is 100 km for most explorations.","They must not enter special regions (caves and subsurface environments deeper than roughly 5 m / 16 ft), even inside the EZ.","Avoid perchlorates completely (a chemical highly dangerous to humans) and any volcanic soil or area with high volcanic probability.","Slope limit: anything over 30° is a no-go."],
s:{a:{b:"One of the youngest flat volcanic regions on Mars, holding huge amounts of pure water ice buried just below the surface. Our best candidate for a safe EZ.",p:["Mostly flat terrain, so the 30° slope rule is easy to follow.","Huge underground ice reserve for ISRU: drinking water, life support and fuel for the return trip."],c:["Dune fields and local tectonic irregularities that can make transit difficult if not well planned.","Perchlorates in the surface dust: they require very strict suits and sealing systems."]},
m:{b:"A vast, gentle plain just south of the equator, famous for sulfate minerals (like gray hematite) showing it was soaked with water long ago. The Opportunity rover landed there in 2004, in Eagle Crater. It is one of the most mapped areas on Mars.",p:["One of the flattest and easiest regions to travel across: minimal slopes.","Flat surface with excellent lines of sight, which eases long-distance navigation."],c:["Dark basaltic sand dunes (like the Ripple Terrain) that can swallow heavy vehicles or make walking hard.","Regolith rich in sulfates and salts: strict protocols against toxicity (perchlorates) are required."]},
g:{b:"An impact crater about 160 km across that once held a large lake fed by the Ma'adim Vallis channel. Later basaltic lava flows covered its floor, and it has a chain of inner hills, the Columbia Hills. The Spirit rover landed there in 2004.",p:["Great geological diversity in a small space: impact plains that are easy to walk and hills with evidence of ancient hydrothermal sources."],c:["The plains looked easy but are carpeted with hidden basalt rocks and trap dust.","In the hills and crater edges, slopes can exceed 30° and the ground is very loose and dusty (the \"Troy\" site, where a rover got stuck).","Spirit got stuck in unstable soil in 2009 and lost contact in 2010."]}}}};
function pages(){const T=N[lang],L=TX[lang];$("nv").innerHTML=T.nv.map((n,i)=>`<a href="#${PG[i]}" data-p="${PG[i]}">${n}</a>`).join("");
$("tc").textContent=T.tc;$("ti").textContent=T.ti;$("te").textContent=T.te;$("tk").textContent=T.tk;
$("sc2").innerHTML=`<table class="tb">${T.sc.map(r=>`<tr><th>${r[0]}</th><td>${r[1]}</td></tr>`).join("")}</table><p>${T.comp}</p>`;
$("ic").innerHTML=`<table class="tb">${D.filter(d=>d.ic!=null).map(d=>`<tr><th>${L.D[d.id][0]}</th><td>${nf(d.ic,1)} m</td><td><div class="bar"><i style="width:${(1.5-d.ic)/1.5*100}%;background:#56b8ff"></i></div></td></tr>`).join("")}</table><p>${T.icn}</p>`;
$("ex").innerHTML=RT.map((r,i)=>{const p=Math.round(expo(i));return `<div class="box" style="margin-bottom:8px"><b>${L.R[i]}</b> <span class="rk ${r.r}">${L.rkw}: ${r.r==="h"?L.rh:L.rm}</span><div class="bar"><i style="width:${p}%"></i></div><small>${p} % ${T.ex}</small></div>`}).join("");
const K=KK[lang],li=a=>`<ul>${a.map(z=>`<li>${z}</li>`).join("")}</ul>`;$("ru").innerHTML=`<b>${K.rt}</b>${li(K.rules)}<small>${K.rn}</small>`;
$("ca").innerHTML=Object.entries(T.c).map(([k,c])=>{const x=K.s[k];return `<div class="box"><b>${c[0]}</b> <span class="rk ${c[3]?"":"h"}">${c[3]?T.lg[0]:T.lg[1]}</span><p>${x.b}</p><p><b>${K.pro}</b></p>${li(x.p)}<p><b>${K.con}</b></p>${li(x.c)}<p><b>${T.why}</b> ${c[2]}</p>${gal(k)}</div>`}).join("");gmap();window.pdfx&&pdfx()}
function route(){let h=location.hash.slice(1);if(!PG.includes(h))h="mapa";document.querySelectorAll("[data-pg]").forEach(e=>e.hidden=e.dataset.pg!==h);document.querySelectorAll("#nv a").forEach(a=>a.classList.toggle("on",a.dataset.p===h));if(h==="mapa"){size();profile()}if(h==="candidatos")gmap();if(h==="modulo"&&window.mod3d)mod3d()}
